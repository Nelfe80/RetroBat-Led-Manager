<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="dome" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- panel board -->
  <rect x="10" y="10" width="740" height="380" rx="18" fill="#1d1d2a" stroke="#3a3a48" stroke-width="2"/>
  <text x="380" y="44" text-anchor="middle" fill="#8a8a9a" font-size="15" font-weight="bold" letter-spacing="2">DISPOSITION STANDARD CONSEILLÉE POUR RETROBAT</text>

  <!-- SELECT / START top-left -->
  <g>
    <circle cx="86" cy="102" r="26" fill="#c8c8d2"/>
    <circle cx="86" cy="102" r="26" fill="url(#dome)"/>
    <circle cx="86" cy="102" r="26" fill="none" stroke="#3a3a48" stroke-width="3"/>
    <text x="86" y="150" text-anchor="middle" fill="#8a8a9a" font-size="12" font-weight="bold">SELECT</text>

    <circle cx="168" cy="102" r="26" fill="#c8c8d2"/>
    <circle cx="168" cy="102" r="26" fill="url(#dome)"/>
    <circle cx="168" cy="102" r="26" fill="none" stroke="#3a3a48" stroke-width="3"/>
    <text x="168" y="150" text-anchor="middle" fill="#8a8a9a" font-size="12" font-weight="bold">START</text>
  </g>

  <!-- top row : B4 B3 B5 B7 -->
  <g>
    <circle cx="200" cy="230" r="38" fill="#30b050"/>
    <circle cx="200" cy="230" r="38" fill="url(#dome)"/>
    <circle cx="200" cy="230" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="200" y="237" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">B4</text>
    <text x="200" y="284" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">Y</text>

    <circle cx="320" cy="218" r="38" fill="#3070ff"/>
    <circle cx="320" cy="218" r="38" fill="url(#dome)"/>
    <circle cx="320" cy="218" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="320" y="225" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">B3</text>
    <text x="320" y="272" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">X</text>

    <circle cx="440" cy="218" r="38" fill="#c040d0"/>
    <circle cx="440" cy="218" r="38" fill="url(#dome)"/>
    <circle cx="440" cy="218" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="440" y="225" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">B5</text>
    <text x="440" y="272" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">L1</text>

    <circle cx="560" cy="230" r="38" fill="#20b0b0"/>
    <circle cx="560" cy="230" r="38" fill="url(#dome)"/>
    <circle cx="560" cy="230" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="560" y="237" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">B7</text>
    <text x="560" y="284" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">L2</text>
  </g>

  <!-- bottom row : B1 B2 B6 B8 -->
  <g>
    <circle cx="240" cy="330" r="38" fill="#ff3030"/>
    <circle cx="240" cy="330" r="38" fill="url(#dome)"/>
    <circle cx="240" cy="330" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="240" y="337" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">B1</text>
    <text x="240" y="384" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">A</text>

    <circle cx="360" cy="318" r="38" fill="#ffd020"/>
    <circle cx="360" cy="318" r="38" fill="url(#dome)"/>
    <circle cx="360" cy="318" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="360" y="325" text-anchor="middle" fill="#333333" font-size="17" font-weight="bold">B2</text>
    <text x="360" y="372" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">B</text>

    <circle cx="480" cy="318" r="38" fill="#ff8c00"/>
    <circle cx="480" cy="318" r="38" fill="url(#dome)"/>
    <circle cx="480" cy="318" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="480" y="325" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">B6</text>
    <text x="480" y="372" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">R1</text>

    <circle cx="600" cy="330" r="38" fill="#e8e8f0"/>
    <circle cx="600" cy="330" r="38" fill="url(#dome)"/>
    <circle cx="600" cy="330" r="38" fill="none" stroke="#3a3a48" stroke-width="4"/>
    <text x="600" y="337" text-anchor="middle" fill="#333333" font-size="17" font-weight="bold">B8</text>
    <text x="600" y="384" text-anchor="middle" fill="#8a8a9a" font-size="13" font-weight="bold">R2</text>
  </g>

  <!-- growth guides -->
  <g fill="#8a8a9a" font-size="12">
    <text x="662" y="234" font-weight="bold" fill="#5a5a6a">6 boutons →</text>
    <text x="662" y="252" fill="#5a5a6a">B5/B6</text>
    <text x="662" y="334" font-weight="bold" fill="#5a5a6a">8 boutons →</text>
    <text x="662" y="352" fill="#5a5a6a">B7/B8</text>
  </g>
