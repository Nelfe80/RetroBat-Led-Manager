[APIExpose]
Enabled=true
DefaultPlayer=1
BaseUrl=ws://127.0.0.1:12345
FrontendPath=/ws/frontend
PanelPath=/ws/panel
IngamePath=/ws/ingame
ArcadePath=/ws/arcade
HiscorePath=/ws/hiscore

[PanelPersistence]
RestoreOnGameEnd=true
SnapshotPath=state\panel-before-game.json

[Effects]
Enabled=true
CatalogPath=default.mem.effects.json

[CommandSenders]
Default=P1
Global=GLOBAL

[PlayerRouting]
# Slots with no specific player (unused/off buttons on the panel) belong to the
# same physical Pico as player 1's buttons - route them there too, otherwise
# they get dropped by the dry-run GLOBAL sender and keep their previous color.
0=P1
1=P1
2=P2
GLOBAL=GLOBAL

[TargetRouting]
MATRIX1=GLOBAL
STRIP1=GLOBAL
CIRCLE1=GLOBAL

# Materiel reellement branche. Les effets ciblant STRIP/CIRCLE/MATRIX/JOY au-dela
# de ces nombres ne generent aucune commande (rien a pousser si rien n'est branche).
[Hardware]
# Nombre de panels joueurs physiquement pilotes. Un jeu 2/3/4 joueurs ne doit pas
# pousser les panels joueurs absents vers le sender par defaut.
PanelPlayers=1
Strips=0
Circles=0
Matrices=0
Joysticks=0

[CommandTemplates]
SetOutput=SET {target} {color}
SetSlot=SLOT {slot} {color}
SetSystem={target} {state}
Clear=CLEAR
All=ALL {color}
Batch=BATCH {items}
MatrixScore=MATRIXSCORE {target} {value} {color}
MatrixText=MATRIXTEXT {target} {color} {text}
Flash=FLASH {target} {color} {durationMs}

[CommandSender:P1]
Name=Pico Player 1
Enabled=true
Player=1
Executable=PicoCommandSender.exe
Mode=daemon
Arguments=daemon --ini "PicoCommandSender.ini" --sender P1
UseStdIn=true
LineEnding=\n
DryRun=false
StartupDelayMs=18000

[CommandSender:P2]
Name=Pico Player 2
Enabled=true
Player=2
Executable=PicoCommandSender.exe
Mode=daemon
Arguments=daemon --ini "PicoCommandSender.ini" --sender P2
UseStdIn=true
LineEnding=\n
DryRun=true
StartupDelayMs=8000

[CommandSender:GLOBAL]
Name=Global LEDs
Enabled=true
Player=0
Executable=PicoCommandSender.exe
Mode=daemon
Arguments=daemon --ini "PicoCommandSender.ini" --sender GLOBAL
UseStdIn=true
LineEnding=\n
DryRun=true
StartupDelayMs=8000
