; =====================================================================
; LedManager.ini - le chef d'orchestre / the conductor
; FR : decide QUOI afficher et VERS QUEL sender l'envoyer.
; EN : decides WHAT to display and WHICH sender receives it.
; La description de votre materiel (GPIO, port COM, couleurs) vit dans
; PicoCommandSender.ini. Documentation complete :
; https://nelfe80.github.io/RetroBat-Led-Manager/
; =====================================================================

[APIExpose]
; Connexion aux flux temps reel d'APIExpose (requis).
; Connection to the APIExpose real-time streams (required).
Enabled=true
DefaultPlayer=1
BaseUrl=ws://127.0.0.1:12345
FrontendPath=/ws/frontend
PanelPath=/ws/panel
IngamePath=/ws/ingame
ArcadePath=/ws/arcade
HiscorePath=/ws/hiscore

[PanelPersistence]
; FR : en fin de partie, restaure les couleurs du panel telles qu'avant le jeu.
; EN : at game end, restores the panel colors as they were before the game.
RestoreOnGameEnd=true
SnapshotPath=state\panel-before-game.json

[Effects]
; Catalogue des effets ingame declenches par les evenements .MEM.
; Catalog of ingame effects triggered by .MEM events.
Enabled=true
CatalogPath=default.mem.effects.json

[FrontendFeedback]
; Pendant la navigation EmulationStation, chaque changement /ws/panel pulse
; START et SELECT pour confirmer que le panel actif vient de changer.
; While browsing EmulationStation, each /ws/panel change pulses START and
; SELECT to confirm the active panel just changed.
StartSelectPulseOnPanelChange=true
StartSelectPulseColor=ORANGE
StartSelectPulseOffColor=BLACK
StartSelectPulseMs=140

[CommandSenders]
; Sender par defaut (panels joueurs) et sender des effets cabinet.
; Default sender (player panels) and cabinet-effects sender.
Default=P1
Global=GLOBAL

[PlayerRouting]
; FR : quel sender recoit les commandes de chaque joueur logique.
; EN : which sender receives each logical player's commands.
; Slots with no specific player (unused/off buttons on the panel) belong to the
; same physical Pico as player 1's buttons - route them there too, otherwise
; they get dropped by the dry-run GLOBAL sender and keep their previous color.
0=P1
1=P1
2=P2
GLOBAL=GLOBAL

[TargetRouting]
; FR : les cibles cabinet (matrice de score, bandeaux, cercles) partent vers
;      le sender GLOBAL plutot que vers un panel joueur.
; EN : cabinet targets (score matrix, strips, circles) go to the GLOBAL
;      sender instead of a player panel.
MATRIX1=GLOBAL
STRIP1=GLOBAL
CIRCLE1=GLOBAL

; Materiel reellement branche. Les effets ciblant STRIP/CIRCLE/MATRIX/JOY au-dela
; de ces nombres ne generent aucune commande (rien a pousser si rien n'est branche).
; Hardware actually plugged in. Effects targeting STRIP/CIRCLE/MATRIX/JOY beyond
; these counts generate no command (nothing to push if nothing is wired).
[Hardware]
; Nombre de panels joueurs physiquement pilotes. Un jeu 2/3/4 joueurs ne doit pas
; pousser les panels joueurs absents vers le sender par defaut.
; Number of physically driven player panels. A 2/3/4-player game must not push
; missing player panels to the default sender.
PanelPlayers=1
Strips=0
Circles=0
Matrices=0
Joysticks=0

[CommandTemplates]
; FR : gabarits des commandes generiques. Pour piloter un autre programme LED,
;      modifiez UNIQUEMENT ces lignes (voir wiki > Cartes LED externes).
; EN : generic command templates. To drive another LED program, change ONLY
;      these lines (see wiki > External LED boards).
SetOutput=SET {target} {color}
SetSlot=SLOT {slot} {color}
SetSystem={target} {state}
Clear=CLEAR
All=ALL {color}
Batch=BATCH {items}
MatrixScore=MATRIXSCORE {target} {value} {color}
MatrixText=MATRIXTEXT {target} {color} {text}
Flash=FLASH {target} {color} {durationMs}

; ---------------------------------------------------------------------
; Senders : un par materiel pilote (un Pico par joueur, par exemple).
; Senders: one per driven hardware (one Pico per player, for instance).
;   DryRun=true       -> commandes journalisees mais PAS envoyees (mode test)
;                        commands logged but NOT sent (test mode)
;   StartupDelayMs    -> laisse le temps au Pico de s'initialiser au demarrage ;
;                        trop court = premieres commandes perdues.
;                        gives the Pico time to init at startup; too short =
;                        first commands lost.
; ---------------------------------------------------------------------

[CommandSender:P1]
Name=Pico Player 1
Enabled=true
Player=1
Executable=PicoCommandSender.exe
Mode=daemon
Arguments=daemon --ini "PicoCommandSender.ini" --sender P1
UseStdIn=true
LineEnding=\n
DryRun=false
StartupDelayMs=18000

[CommandSender:P2]
Name=Pico Player 2
Enabled=true
Player=2
Executable=PicoCommandSender.exe
Mode=daemon
Arguments=daemon --ini "PicoCommandSender.ini" --sender P2
UseStdIn=true
LineEnding=\n
DryRun=true
StartupDelayMs=8000

[CommandSender:GLOBAL]
Name=Global LEDs
Enabled=true
Player=0
Executable=PicoCommandSender.exe
Mode=daemon
Arguments=daemon --ini "PicoCommandSender.ini" --sender GLOBAL
UseStdIn=true
LineEnding=\n
DryRun=true
StartupDelayMs=8000
