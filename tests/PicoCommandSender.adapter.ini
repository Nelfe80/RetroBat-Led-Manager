[Identity]
SenderId=TEST
Player=1
Role=player

[Serial]
Port=DRYRUN
BaudRate=115200
BootDelayMs=0
PostInitDelayMs=0
ProbeTimeoutMs=100
WriteTimeoutMs=15000
LineEnding=\n
Transport=Native
BridgeScript=tools\serial-bridge.ps1
DryRun=true

[Pico]
InitCommands=PING

[CommandAdapter]
Enabled=true
Mode=PicoFullPanelPwm
FullPanelSlots=8
FullPanelCommand=ALLPCT {r} {g} {b}
LogTranslations=true

[CommandAdapter.FullPanelColors]
WHITE=0,0,0
BLACK=100,100,100
CYAN=0,100,0
YELLOW=0,0,100
PURPLE=100,25,25
GRAY=50,50,50
GREY=50,50,50

[CommandAdapter.FullPanelAliases]
ORANGE=YELLOW
GOLD=YELLOW
TEAL=CYAN
