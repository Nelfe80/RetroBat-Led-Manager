# PicoCommandSender.ini
# ============================================================
# Fichier unique du process PicoCommandSender.
#
# Principe :
# - LedManager decide quoi afficher.
# - PicoCommandSender connait le materiel reel branche au Pico.
# - L'utilisateur decrit son panel avec des mots simples : NONE, LED, RGBLED.
# - Le sender traduit ensuite vers les commandes firmware INIT/PTR/COMMIT.
#
# Types acceptes cote utilisateur :
#   NONE   = absent.
#   LED    = LED simple ON/OFF, 1 GPIO.
#   RGBLED = LED RGB directe, 3 GPIO.
#   ADDRLED = LED adressable WS2812/NeoPixel. Support documente ici, init
#             automatique a finaliser via profils/override pour les gros setups.
#
# GPIO Pico utilisables : GP0..GP22 + GP26..GP28, soit 26 GPIO.
# GP25 est reserve a la LED interne du Pico.
# Attention : 1 RGBLED = 3 GPIO, 1 LED = 1 GPIO.
# Exemple actuel : 8 boutons RGBLED + START LED + SELECT LED = 26/26 GPIO.
#
# Plan de cablage et documentation complete / wiring diagram and full docs:
# https://nelfe80.github.io/RetroBat-Led-Manager/
# ============================================================

[Identity:P1]
SenderId=P1
Player=1
Role=player

[Serial:P1]
# Port = LE premier reglage a verifier apres installation.
# Gestionnaire de peripheriques Windows > Ports (COM) > votre Pico.
# Port = THE first setting to check after install (Windows Device Manager).
Port=COM3
BaudRate=115200
BootDelayMs=800
PostInitDelayMs=9000
ProbeTimeoutMs=900
WriteTimeoutMs=15000
LineEnding=\n
Transport=PowerShellBridge
BridgeScript=tools\serial-bridge.ps1
DryRun=false

[Pico:P1]
# AutoInitFromHardware=true construit l'init firmware depuis [Hardware:P1] et
# [GPIO:P1]. L'utilisateur n'a donc pas besoin de connaitre les profils internes
# du firmware comme GPIO_8B_SS_GPIO.
AutoInitFromHardware=true

[Hardware:P1]
PanelButtons=8
PanelButtonType=RGBLED
Start=LED
Select=LED
Joystick1=NONE
Joystick2=NONE
OnOffInvert=true

[GPIO:P1]
# RGBLED = trois GPIO dans l'ordre R,G,B.
B1=0,1,2
B2=3,4,5
B3=6,7,8
B4=9,10,11
B5=12,13,14
B6=15,16,17
B7=18,19,20
B8=21,22,26
# LED simple = un seul GPIO.
START=27
SELECT=28
# Si un joystick RGB est ajoute un jour :
# JOY1=...
# JOY2=...

[CommandAdapter:P1]
Enabled=true
Mode=PicoFullPanelPwm
FullPanelSlots=8
FullPanelCommand=ALLPCT {r} {g} {b}
LogTranslations=true

[Identity:P2]
SenderId=P2
Player=2
Role=player

[Serial:P2]
Port=auto
BaudRate=115200
BootDelayMs=800
PostInitDelayMs=2200
ProbeTimeoutMs=900
WriteTimeoutMs=15000
LineEnding=\n
Transport=PowerShellBridge
BridgeScript=tools\serial-bridge.ps1
DryRun=true

[Pico:P2]
# P2 est pret mais inactif/dry-run par defaut.
AutoInitFromHardware=false
InitCommands=PING|HW GPIO_8B_SS_GPIO|ONOFFINVERT ON|GET

[CommandAdapter:P2]
Enabled=false
Mode=PicoFullPanelPwm
FullPanelSlots=8
FullPanelCommand=ALLPCT {r} {g} {b}
LogTranslations=true

[Identity:GLOBAL]
SenderId=GLOBAL
Player=0
Role=global

[Serial:GLOBAL]
Port=auto
BaudRate=115200
BootDelayMs=800
PostInitDelayMs=2200
ProbeTimeoutMs=900
WriteTimeoutMs=15000
LineEnding=\n
Transport=PowerShellBridge
BridgeScript=tools\serial-bridge.ps1
DryRun=true

[Pico:GLOBAL]
AutoInitFromHardware=false
InitCommands=PING|GET

[CommandAdapter:GLOBAL]
Enabled=false
Mode=PicoFullPanelPwm
FullPanelSlots=8
FullPanelCommand=ALLPCT {r} {g} {b}
LogTranslations=true

# ============================================================
# Elements avances, documentes pour les futures configs.
# Ces sections ne sont pas encore consommees automatiquement pour tous les cas.
# Pour un setup adressable complexe, utiliser provisoirement
# [Advanced:<sender>] InitCommandsOverride.
# ============================================================

[Matrix1]
Enabled=false
Type=ADDRLED
Width=16
Height=16
BusGpio=
Pixels=
Route=GLOBAL

[Strip1]
Enabled=false
Type=ADDRLED
Pixels=60
BusGpio=
Route=GLOBAL

[Circle1]
Enabled=false
Type=ADDRLED
Pixels=24
BusGpio=
Route=GLOBAL

[Score]
Enabled=false
Target=Matrix1
Command=MATRIXSCORE

[Advanced:P1]
# Override expert uniquement. Si renseigne, remplace AutoInitFromHardware.
# Exemple :
# InitCommandsOverride=PING|INIT|PTR B1 BUTTON RGB 1 0,1,2 LOW|COMMIT|GET
InitCommandsOverride=

# ============================================================
# Couleurs full-panel stables.
# GRAY est le nom canonique unique pour le gris.
# ============================================================

[CommandAdapter.FullPanelColors]
WHITE=0,0,0
PINK=100,0,50
CYAN=0,100,0
YELLOW=0,0,100
BLUE=100,100,0
RED=100,0,100
GREEN=0,100,100
BLACK=100,100,100
LIME=25,100,100
VIOLET=100,75,0
PURPLE=100,25,25
GRAY=75,75,75
TURQUOISE=25,100,0
AQUA=25,100,25
MAGENTA=100,0,0
LEMON=0,25,100

[CommandAdapter.FullPanelAliases]
ORANGE=YELLOW
GOLD=YELLOW
TEAL=TURQUOISE

# ============================================================
# Color policy.
# Sert a eviter les combinaisons de couleurs qui deviennent instables selon la
# charge RGB du panel. Les decisions viennent des tests utilisateur.
# ============================================================

[ColorPolicy]
Enabled=true
LogDecisions=true
Unknown=allow
OnDeny=fallback
SlotCommand=SLOTPWM
UseSlotCommandForAllowed=true
IncludeUnknownTargets=false
# Seulement les sorties RGB participent a la charge couleur.
RgbTargets=1,2,3,4,5,6,7,8
# START/SELECT sont des LED simples sur la config actuelle.
IgnoredTargets=START,SELECT

[ColorPolicy.Fallbacks]
GOLD=YELLOW
PURPLE=VIOLET
# BLACK signifie eteint. GRAY est un bouton actif, donc fallback vers WHITE.
GRAY=WHITE

[ColorPolicy.Single]
AQUA=1:allow,2:allow,4:allow,6:allow,8:allow
BLUE=1:allow,2:allow,4:allow,6:allow,8:allow
GOLD=1:deny,2:allow,4:allow,6:deny,8:deny
GRAY=1:deny,2:allow,4:allow,6:allow,8:allow
GREEN=1:allow,2:allow,4:allow,6:allow,8:allow
LEMON=1:allow,2:allow,4:allow,6:allow,8:allow
LIME=1:allow,2:allow,4:allow,6:allow,8:allow
MAGENTA=1:allow,2:allow,4:allow,6:allow,8:allow
ORANGE=1:allow,2:allow,4:allow,6:allow,8:allow
PURPLE=1:deny,2:allow,4:allow,6:deny,8:deny
RED=1:allow,2:allow,4:allow,6:allow,8:allow
TURQUOISE=1:allow,2:allow,4:allow,6:allow,8:allow
VIOLET=1:allow,2:allow,4:allow,6:allow,8:allow
WHITE=1:allow,2:allow,4:allow,6:allow,8:allow
YELLOW=1:allow,2:allow,4:allow,6:allow,8:allow

[ColorPolicy.Pair]
AQUA|BLUE=2+6:allow,4+4:allow,6+2:allow
AQUA|GREEN=2+6:allow,4+4:allow,6+2:allow
AQUA|LEMON=2+6:allow,4+4:allow,6+2:deny
