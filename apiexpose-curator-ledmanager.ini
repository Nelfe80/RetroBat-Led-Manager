[APIExpose]
enabled = false
defaultplayer = 1
baseurl = ws://127.0.0.1:12345
frontendpath = /ws/frontend
panelpath = /ws/panel
ingamepath = /ws/ingame
arcadepath = /ws/arcade
hiscorepath = /ws/hiscore

[PanelPersistence]
restoreongameend = true
snapshotpath = state\panel-before-game.json

[Effects]
enabled = true
catalogpath = default.mem.effects.json

[CommandSenders]
default = P1
global = GLOBAL

[PlayerRouting]
0 = P1
1 = P1
2 = P2
global = GLOBAL

[TargetRouting]
matrix1 = GLOBAL
strip1 = GLOBAL
circle1 = GLOBAL

[Hardware]
panelplayers = 1
strips = 0
circles = 0
matrices = 0
joysticks = 0

[CommandTemplates]
setoutput = SET {target} {color}
setslot = SLOT {slot} {color}
setsystem = {target} {state}
clear = CLEAR
all = ALL {color}
batch = BATCH {items}
matrixscore = MATRIXSCORE {target} {value} {color}
matrixtext = MATRIXTEXT {target} {color} {text}
flash = FLASH {target} {color} {durationMs}

[CommandSender:P1]
name = Pico Player 1
enabled = true
player = 1
executable = PicoCommandSender.exe
mode = daemon
arguments = daemon --ini "PicoCommandSender.ini" --sender P1
usestdin = true
lineending = \n
dryrun = false
startupdelayms = 18000

[CommandSender:P2]
name = Pico Player 2
enabled = true
player = 2
executable = PicoCommandSender.exe
mode = daemon
arguments = daemon --ini "PicoCommandSender.ini" --sender P2
usestdin = true
lineending = \n
dryrun = true
startupdelayms = 8000

[CommandSender:GLOBAL]
name = Global LEDs
enabled = true
player = 0
executable = PicoCommandSender.exe
mode = daemon
arguments = daemon --ini "PicoCommandSender.ini" --sender GLOBAL
usestdin = true
lineending = \n
dryrun = true
startupdelayms = 8000

